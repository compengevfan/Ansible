---
- name: GetCredentials
  # Domain controllers and the CA belong to MonitoringOnly and must never get
  # this baseline - it installs Chocolatey and desktop software and reboots
  # unconditionally. They get ConfigureMonitoringWindows.yml instead. An AWX
  # limit intersects with this pattern, so it cannot widen it.
  hosts: 'all:!MonitoringOnly'
  gather_facts: no
  tasks:
    - name: Obtain Credentials
      include_role:
        name: GetVaultCreds
      vars:
        includecred:
          - evoriginda
          - zabbixapi
          - dfdeploy

- name: Run
  # Domain controllers and the CA belong to MonitoringOnly and must never get
  # this baseline - it installs Chocolatey and desktop software and reboots
  # unconditionally. They get ConfigureMonitoringWindows.yml instead. An AWX
  # limit intersects with this pattern, so it cannot widen it.
  hosts: 'all:!MonitoringOnly'
  gather_facts: yes
  vars:
    ansible_user:     "{{ evoriginda_cred.username }}"
    ansible_password: "{{ evoriginda_cred.password }}"
  tasks:
    - name: Run the ConfigureWindows Role
      include_role:
        name: ConfigureWindows

    - name: Add host to Zabbix
      include_role:
        name: AddToZabbix

    - name: Add host to Prometheus
      include_role:
        name: AddToPrometheus