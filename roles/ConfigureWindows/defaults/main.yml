---
# defaults file for ConfigureWindows

# Hosts that must never receive the full member-server baseline. Domain
# controllers are detected from facts rather than inventory, so a newly promoted
# DC is protected even if nobody remembers to add it to the group.
configure_windows_baseline_allowed: true
configure_windows_monitoring_only_group: MonitoringOnly
configure_windows_blocked_domain_roles:
  - Primary domain controller
  - Backup domain controller

# Zabbix and windows_exporter settings live in ConfigureMonitoringWindows, which
# this role includes. zabbix_agent_conf_path in particular was the Chocolatey
# package's layout and no longer applies now that the vendor MSI is used.

# Registry "Release" value that means .NET Framework 4.8 or newer is installed.
# 528040 = 4.8, 533320 = 4.8.1 (the final .NET Framework release).
netfx_48_release: 528040

# Modern .NET (Core) runtimes to install via Chocolatey. Empty = skip.
# .NET 10 is the current LTS (supported through 2028-11-14); .NET 8 and 9 both
# go end-of-support 2026-11-10, so don't pin new builds to either.
#   dotnet-10.0-runtime         - console/service apps
#   dotnet-10.0-aspnetruntime   - ASP.NET Core web apps
#   dotnet-10.0-desktopruntime  - WPF/WinForms apps
#   dotnet-10.0-sdk             - build machines only
dotnet_runtime_packages: []
