- name: Create Temp Directory
  win_file:
    path: "C:\\Temp"
    state: directory
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Set timezone
  win_shell: |
    $TimeZone = Get-TimeZone
    if ($TimeZone.Id -ne "Eastern Standard Time") {
      Write-Output "Setting Time Zone to EST."
      Set-TimeZone -Id "Eastern Standard Time"
    }
    else { Write-Output "TimeZone already set to EST." }
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Set execution policy
  win_shell: |
    $ExecPolicy = Get-ExecutionPolicy
    if ($ExecPolicy -ne "Unrestricted") {
      Write-Output "Setting Execution Policy to Unrestricted."
      Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope LocalMachine -Force
    }
    else { Write-Output "Execution Policy already set to Unrestricted." }
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Install NuGet
  win_shell: "Install-PackageProvider -Name NuGet -Force"
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

# Chocolatey CLI 2.x requires .NET Framework 4.8. Server 2022 and newer ship
# with 4.8/4.8.1 already, so only install it where it is actually missing.
- name: Check installed .NET Framework 4.x release
  win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full
    name: Release
  register: netfx_release
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Install .NET 4.8
  block:
    - name: Download the installer
      win_get_url:
        url: https://go.microsoft.com/fwlink/?linkid=2088631
        dest: C:\Temp\ndp48-web.exe
      register: download_status
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

    - name: Check if the file was downloaded successfully
      win_stat:
        path: C:\Temp\ndp48-web.exe
      register: file_status
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

    - name: Fail if file download was not successful
      fail:
        msg: "The .NET Framework 4.8 installer could not be downloaded."
      when: not file_status.stat.exists
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

    - name: Install .NET Framework 4.8
      win_package:
        path: C:\Temp\ndp48-web.exe
        arguments: "/quiet /norestart"
        state: present
      register: netfx_install
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

    - name: Remove .NET Framework installer
      win_file:
        path: C:\Temp\ndp48-web.exe
        state: absent
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

    - name: Reboot after installing .NET 4.8
      win_reboot:
      when: netfx_install is changed
      # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"
  when: not netfx_release.exists or (netfx_release.value | default(0) | int) < netfx_48_release

- name: Check for Chocolatey
  win_stat:
    path: C:\ProgramData\chocolatey\bin\choco.exe
  register: chocolatey_check

- name: Install Chocolatey
  block:
    - name: Download Chocolatey MSI
      win_get_url:
        url: https://github.com/chocolatey/choco/releases/download/2.7.3/chocolatey-2.7.3.0.msi
        dest: C:\Temp\chocolatey.msi

    - name: Install Chocolatey via MSI
      win_package:
        path: C:\Temp\chocolatey.msi
        arguments: /quiet /norestart
        state: present
      register: choco_install

    - name: Remove Chocolatey MSI installer
      win_file:
        path: C:\Temp\chocolatey.msi
        state: absent
      when: choco_install is changed

    - name: Reboot after installing Chocolatey
      win_reboot:
  when: not chocolatey_check.stat.exists

- name: Install Software
  win_chocolatey: 
    name: 
      - git.install
      - notepadplusplus
      - brave
      - winscp.install
      - vscode
      - putty
      - windirstat
      - 7zip.install
    state: present
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

# Modern .NET (Core) is side-by-side with .NET Framework, not a replacement.
# Only needed on hosts that actually run .NET apps -- set dotnet_runtime_packages
# in inventory/group_vars to opt in. See defaults/main.yml for the options.
- name: Install modern .NET runtime
  win_chocolatey:
    name: "{{ dotnet_runtime_packages }}"
    state: present
  when: dotnet_runtime_packages | length > 0
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

# This role used to install zabbix-agent and prometheus-windows-exporter.install
# from Chocolatey. Both collide with the vendor MSIs the monitoring role uses:
# choco's zabbix-agent fails with "Cannot create a file when that file already
# exists" once C:\ProgramData\zabbix is present, and the exporter package wraps
# the very same MSI, so it exits 1603 when an equal or newer version is already
# installed. Hand both back to the MSIs on any host still carrying them.
#
# Gated on the Chocolatey check from before the install above: if Chocolatey was
# not already present on this host, it cannot be carrying the old packages.
- name: Remove the Chocolatey-installed monitoring agents
  block:
    - name: Uninstall the Chocolatey Zabbix agent package
      win_chocolatey:
        name: zabbix-agent
        state: absent
      register: choco_zabbix_removed
      ignore_errors: true

    - name: Uninstall the Chocolatey windows_exporter package
      win_chocolatey:
        name: prometheus-windows-exporter.install
        state: absent
      register: choco_exporter_removed
      ignore_errors: true

    # Chocolatey's config layout, not the MSI's. Left behind, it becomes a
    # second candidate in the config discovery the monitoring role does.
    - name: Remove the Chocolatey Zabbix agent directory
      win_file:
        path: C:\ProgramData\zabbix
        state: absent
      when: choco_zabbix_removed is changed

    - name: Warn if a Chocolatey package could not be removed
      debug:
        msg: >-
          Chocolatey could not cleanly uninstall the monitoring packages on
          {{ ansible_fqdn }}, which is what a partially installed package does.
          The MSI installs below still run, but if an agent ends up in a bad
          state, run 'choco uninstall zabbix-agent
          prometheus-windows-exporter.install' by hand and re-run.
      when: choco_zabbix_removed is failed or choco_exporter_removed is failed
  when: chocolatey_check.stat.exists

# Monitoring agents come from the vendor MSIs, not Chocolatey, so a host gets the
# same result whichever playbook touches it - and so the same role can be used on
# domain controllers, where Chocolatey is not an option.
- name: Install and configure the monitoring agents
  include_role:
    name: ConfigureMonitoringWindows

- name: Check for PowerShell 7
  win_stat:
    path: C:\Program Files\PowerShell\7\pwsh.exe
  register: ps7_check
  failed_when: false

- name: Install PowerShell 7
  block:
  - name: Get the latest PowerShell 7 release info from GitHub
    win_uri:
      url: "https://api.github.com/repos/PowerShell/PowerShell/releases/latest"
      method: GET
      return_content: yes
      status_code: 200
    register: release_info

  - name: Extract MSI download URL from release info
    set_fact:
      msi_url: "{{ release_info.json.assets | selectattr('name', 'match', '.*win-x64.msi$') | map(attribute='browser_download_url') | list | first }}"

  - name: Download latest PowerShell 7 MSI
    win_get_url:
      url: "{{ msi_url }}"
      dest: C:\Temp\PowerShell-7-latest.msi
    # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

  - name: Install PowerShell 7
    win_package:
      path: C:\Temp\PowerShell-7-latest.msi
      arguments: /quiet /norestart
      state: present
    register: pwsh_install
    # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

  - name: Remove MSI installer file
    win_file:
      path: C:\Temp\PowerShell-7-latest.msi
      state: absent
    when: pwsh_install is changed
    # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"
  when: ps7_check.stat.exists == false

- name: Reboot after installing software
  win_reboot:
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Install PowerShell modules
  win_shell: |
    Install-Module Posh-SSH -Scope AllUsers -Force
  # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"

- name: Check for DupreeFunctions
  win_shell: |
    Get-Module DupreeFunctions -ListAvailable
  register: df_check
  failed_when: false

- name: Install DupreeFunctions if not found
  block:
  - name: Download my PowerShell repo
    win_shell: "git clone https://github.com/compengevfan/PowerShell.git C:\\Temp\\PowerShell"
    # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"
    ignore_errors: true

  - name: Install DupreeFunctions
    win_shell: |
      $DfVersion = (Get-Module -ListAvailable -FullyQualifiedName C:\Temp\PowerShell\DupreeFunctions).Version.ToString()
      New-Item -Path "C:\Program Files\WindowsPowerShell\Modules" -Name DupreeFunctions -ItemType Directory -Force
      Copy-Item -Path C:\Temp\PowerShell\DupreeFunctions -Destination "C:\Program Files\WindowsPowerShell\Modules\DupreeFunctions\$DfVersion" -Recurse
      Remove-Item C:\Temp\PowerShell -Recurse -Force -Confirm:$false
    # delegate_to: "{{ ServerNameUpper }}.{{ ConfigFileContents_JSON.Domain }}"
  when: df_check.rc != 0

