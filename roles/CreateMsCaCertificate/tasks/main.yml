---
# tasks file for CreateMsCaCertificate
- name: Check that ServerName is set for a host certificate
  assert:
    that: Wildcard | bool or ServerName is defined
    fail_msg: "Set ServerName, or pass Wildcard=true for a *.{{ Domain }} certificate"

- name: Remove Certificate folder
  win_file:
    path: "{{ cert_folder }}"
    state: absent

- name: Create certificate folder
  win_file:
    path: "{{ cert_folder }}"
    state: directory

- name: Create request.inf for certreq
  win_template:
    src: request.inf.j2
    dest: "{{ cert_folder }}\\{{ cert_name }}.inf"

# runas is required for every certreq step: over WinRM the session gets a network logon
# token with no credentials to spend on a second hop, so the LDAP read of the enrolment
# policy fails with 0x800704dc ERROR_NOT_AUTHENTICATED. Running as SYSTEM puts the
# machine account on the wire instead, which needs no delegation. The CA template must
# therefore grant Enroll to the computer account.
- name: Generate CSR using certreq
  win_shell: >
    certreq -new -q
    "{{ cert_folder }}\{{ cert_name }}.inf"
    "{{ cert_folder }}\{{ cert_name }}.csr"
  become: true
  become_method: runas
  become_user: SYSTEM

- name: Submit the CSR to the CA and retrieve the signed certificate
  win_shell: >
    certreq -submit -q -config "{{ ca_config }}"
    "{{ cert_folder }}\{{ cert_name }}.csr"
    "{{ cert_folder }}\{{ cert_name }}.cer"
  become: true
  become_method: runas
  become_user: SYSTEM

# Also SYSTEM, so -accept matches the pending request raised by -new above.
- name: Accept the certificate into the local machine certificate store
  win_command: >
    certreq -accept
    "{{ cert_folder }}\{{ cert_name }}.cer"
  become: true
  become_method: runas
  become_user: SYSTEM

- name: Get the thumbprint of the newly installed cert
  # Read it from the .cer that certreq -submit wrote this run, so older certificates
  # with the same CN in LocalMachine\My can't be picked up by mistake.
  win_shell: >
    (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
    '{{ cert_folder }}\{{ cert_name }}.cer').Thumbprint
  register: cert_thumbprint

- name: Debug thumbprint (for troubleshooting)
  debug:
    msg: "Certificate Thumbprint: {{ cert_thumbprint.stdout | trim }}"

- name: Export certificate and private key to PFX
  # Requires that the private key is marked Exportable=TRUE in the INF. SYSTEM again,
  # because SYSTEM created the machine key above and the export has to read it back.
  win_shell: >
    $pw = ConvertTo-SecureString -String "{{ pfx_password }}" -Force -AsPlainText;
    Export-PfxCertificate -Cert 'Cert:\LocalMachine\My\{{ cert_thumbprint.stdout | trim }}' -FilePath '{{ cert_folder }}\{{ cert_name }}.pfx' -Password $pw
  become: true
  become_method: runas
  become_user: SYSTEM

- name: Split the .pfx into .key and .crt using openssl (if OpenSSL is installed on Windows)
  # Extract the private key
  win_shell: >
    openssl pkcs12 -in "{{ cert_folder }}\{{ cert_name }}.pfx"
    -nocerts -nodes -password pass:{{ pfx_password }}
    -out "{{ cert_folder }}\{{ cert_name }}.key"

- name: Split the .pfx into .key and .crt using openssl (if OpenSSL is installed on Windows)
  # Extract the public cert
  win_shell: >
    openssl pkcs12 -in "{{ cert_folder }}\{{ cert_name }}.pfx"
    -clcerts -nokeys -password pass:{{ pfx_password }}
    -out "{{ cert_folder }}\{{ cert_name }}.crt"
