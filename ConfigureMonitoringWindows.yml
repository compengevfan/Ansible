---
# Monitoring-only baseline for Windows servers that are already built and in
# service (domain controllers, the certificate authority, etc.). Installs and
# configures the Zabbix agent and windows_exporter, then registers the host in
# Zabbix. Never reboots. For new member server builds use ConfigureWindows.yml.
- name: GetCredentials
  hosts: all
  gather_facts: no
  tasks:
    - name: Obtain Credentials
      include_role:
        name: GetVaultCreds
      vars:
        includecred:
          - evoriginda
          - zabbixapi
          - linuxroot

- name: Run
  hosts: all
  gather_facts: yes
  vars:
    ansible_user:     "{{ evoriginda_cred.username }}"
    ansible_password: "{{ evoriginda_cred.password }}"
  tasks:
    - name: Run the ConfigureMonitoringWindows Role
      include_role:
        name: ConfigureMonitoringWindows

    - name: Add host to Zabbix
      include_role:
        name: AddToZabbix

    - name: Add host to Prometheus
      include_role:
        name: AddToPrometheus
